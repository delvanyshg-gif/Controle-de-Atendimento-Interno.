<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Atendimento Interno</title>
  
  <!-- CSS NATIVO EMBUTIDO: Funciona offline e sem depender de CDN externa -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      padding: 2rem 1rem;
    }
    .container {
      max-w: 56rem;
      max-width: 896px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.875rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
    }
    .subtitle {
      color: #64748b;
      margin-top: 0.25rem;
      font-size: 0.875rem;
    }
    .filter-box {
      background-color: #ffffff;
      padding: 1.25rem;
      border-radius: 1rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    @media (min-width: 768px) {
      .filter-box {
        flex-direction: row;
      }
      .search-group { flex: 2; }
      .select-group { flex: 1; }
    }
    label {
      display: block;
      text-transform: uppercase;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.05em;
      margin-bottom: 0.375rem;
    }
    input, select {
      width: 100%;
      padding: 0.625rem 1rem;
      background-color: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      color: #334155;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: #3b82f6;
      background-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    main {
      background-color: #ffffff;
      border-radius: 1rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }
    .list-header {
      background-color: #f8fafc;
      padding: 0.75rem 1.5rem;
      border-b: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #counter {
      background-color: #eff6ff;
      color: #1d4ed8;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      border: 1px solid #dbeafe;
    }
    ul {
      list-style: none;
    }
    li {
      padding: 1.5rem;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }
    @media (min-width: 640px) {
      li {
        flex-direction: row;
        align-items: center;
      }
    }
    li:last-child {
      border-bottom: none;
    }
    li:hover {
      background-color: #f8fafc;
    }
    .item-main {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .item-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .item-id {
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      background-color: #f1f5f9;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
    }
    .item-name {
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
    }
    .item-desc {
      font-size: 0.875rem;
      color: #475569;
      line-height: 1.5;
    }
    .item-date {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    /* Badges de Status personalizados */
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 9999px;
      border-width: 1px;
      border-style: solid;
      text-align: center;
      align-self: flex-start;
    }
    .status-aberto { background-color: #eff6ff; color: #1d4ed8; border-color: #dbeafe; }
    .status-atendimento { background-color: #fffbeb; color: #b45309; border-color: #fef3c7; }
    .status-resolvido { background-color: #ecfdf5; color: #047857; border-color: #d1fae5; }
    .status-cancelado { background-color: #fff1f2; color: #be123c; border-color: #ffe4e6; }
    
    .empty-state {
      padding: 3rem;
      text-align: center;
      color: #94a3b8;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Cabeçalho -->
    <header>
      <h1>Controle de Atendimento Interno</h1>
      <p class="subtitle">Gerencie, busque e filtre o status das solicitações em tempo real.</p>
    </header>

    <!-- Filtros -->
    <div class="filter-box">
      <div class="search-group">
        <label for="search-input">Palavra-chave</label>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar por descrição, solicitante ou ID..." 
        />
      </div>

      <div class="select-group">
        <label for="status-filter">Status da Solicitação</label>
        <select id="status-filter">
          <option value="">Todos os Status</option>
          <option value="Aberto">Aberto 🔵</option>
          <option value="Em Atendimento">Em Atendimento 🟡</option>
          <option value="Resolvido">Resolvido 🟢</option>
          <option value="Cancelado">Cancelado 🔴</option>
        </select>
      </div>
    </div>

    <!-- Lista de Solicitações -->
    <main>
      <div class="list-header">
        <span class="list-title">Solicitações Registradas</span>
        <span id="counter">0 encontrados</span>
      </div>

      <ul id="solicitacoes-list">
        <!-- Inserido dinamicamente pelo JavaScript abaixo -->
      </ul>
    </main>

  </div>

  <script>
    const solicitacoes = [
      { id: "CH-101", solicitante: "Carlos Henrique", descricao: "Acesso ao repositório Git travado", status: "Aberto", data: "07/10/2026" },
      { id: "CH-102", solicitante: "Ana Paula", descricao: "Configurar variáveis de ambiente do servidor externo", status: "Em Atendimento", data: "07/10/2026" },
      { id: "CH-103", solicitante: "Bruno Mendes", descricao: "Erro 500 ao salvar formulário de atendimento interno", status: "Resolvido", data: "06/10/2026" },
      { id: "CH-104", solicitante: "Mariana Costa", descricao: "Instalação de dependências do Tailwind CSS na máquina local", status: "Aberto", data: "05/10/2026" },
      { id: "CH-105", solicitante: "Diego Lima", descricao: "Homologar deploy da branch principal no ambiente de teste", status: "Cancelado", data: "04/10/2026" }
    ];

    // Mapeamento de classes CSS nativas para cada tipo de status
    const statusClasses = {
      "Aberto": "status-aberto",
      "Em Atendimento": "status-atendimento",
      "Resolvido": "status-resolvido",
      "Cancelado": "status-cancelado"
    };

    const searchInput = document.getElementById('search-input');
    const statusFilter = document.getElementById('status-filter');
    const solicitacoesList = document.getElementById('solicitacoes-list');
    const counterBadge = document.getElementById('counter');

    function renderizarFiltros() {
      const termo = searchInput.value.trim().toLowerCase();
      const statusFiltro = statusFilter.value;

      const resultado = solicitacoes.filter(item => {
        const bateTexto = item.descricao.toLowerCase().includes(termo) || 
                           item.solicitante.toLowerCase().includes(termo) || 
                           item.id.toLowerCase().includes(termo);
        const bateStatus = statusFiltro === "" || item.status === statusFiltro;
        
        return bateTexto && bateStatus;
      });

      counterBadge.innerText = `${resultado.length} ${resultado.length === 1 ? 'encontrado' : 'encontrados'}`;

      if (resultado.length === 0) {
        solicitacoesList.innerHTML = `
          <div class="empty-state">
            <p>Nenhuma solicitação corresponde aos filtros aplicados.</p>
          </div>`;
        return;
      }

      solicitacoesList.innerHTML = resultado.map(item => `
        <li>
          <div class="item-main">
            <div class="item-header">
              <span class="item-id">${item.id}</span>
              <h3 class="item-name">${item.solicitante}</h3>
            </div>
            <p class="item-desc">${item.descricao}</p>
            <div class="item-date">Registrado em: ${item.data}</div>
          </div>
          <div>
            <span class="badge ${statusClasses[item.status] || ''}">
              ${item.status}
            </span>
          </div>
        </li>
      `).join('');
    }

    searchInput.addEventListener('input', renderizarFiltros);
    statusFilter.addEventListener('change', renderizarFiltros);

    renderizarFiltros();
  </script>
</body>
</html>
