
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Atende+</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/db.js" defer></script>
    <script src="js/cadastro.js" defer></script>
</head>

<body>

    <main class="login-main">

        <div class="login-box">

            <header class="login-header">

                <p class="eyebrow">
                    ATENDE+
                </p>

                <h1>
                    Criar sua conta
                </h1>

                <p>
                    Cadastre seus dados para acessar o sistema.
                </p>

            </header>

            <form id="register-form" class="login-form">

                <div class="field">

                    <label for="name">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Seu nome"
                        autocomplete="name"
                        required
                    >

                </div>

                <div class="field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="voce@empresa.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="field">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="field">

                    <label for="confirm-password">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Criar conta
                    <span>→</span>
                </button>

                <p
                    id="register-message"
                    class="form-message"
                    aria-live="polite"
                ></p>

            </form>

            <div class="register-area">

                <p>
                    Já possui uma conta?
                </p>

                <a
                    href="index.html"
                    class="register-link"
                >
                    Voltar para o login
                </a>

            </div>

        </div>

    </main>

</body>

</html>
